name: Release

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

env:
  LEFTHOOK: "0"

jobs:
  release-please:
    name: Release PR / tag
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          # A PAT or GitHub App token lets CI run on the release PR; GITHUB_TOKEN does not.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    name: Build ${{ matrix.target }}
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: ubuntu-24.04, target: bun-linux-x64, name: xuefu-linux-x64 }
          - { os: ubuntu-24.04-arm, target: bun-linux-arm64, name: xuefu-linux-arm64 }
          - { os: macos-15, target: bun-darwin-arm64, name: xuefu-darwin-arm64 }
          - { os: macos-15-intel, target: bun-darwin-x64, name: xuefu-darwin-x64 }
    # Native runners per target: the TUI stack ships platform-specific native libraries.
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false

      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          cache: true

      - name: Install
        run: bun install --frozen-lockfile

      - name: Test
        run: bun run test

      - name: Build
        run: bun scripts/build.ts --target "${{ matrix.target }}" --outfile "dist/xuefu"

      - name: Smoke test
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
          XUEFU_CONFIG_DIR: ${{ runner.temp }}/xuefu-config
          XUEFU_DATA_DIR: ${{ runner.temp }}/xuefu-data
        run: |
          actual="$(./dist/xuefu --version)"
          if [ "$actual" != "${TAG#v}" ]; then
            echo "binary reports $actual but tag is $TAG" >&2
            exit 1
          fi
          ./dist/xuefu diagnostics --json > /dev/null

      - name: Package
        run: |
          mkdir -p out
          cp LICENSE NOTICE dist/
          tar -C dist -czf "out/${{ matrix.name }}.tar.gz" xuefu LICENSE NOTICE

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.name }}
          path: out/${{ matrix.name }}.tar.gz
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish assets
    needs: [release-please, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: out
          merge-multiple: true

      - name: Checksums
        working-directory: out
        run: sha256sum -- *.tar.gz > SHA256SUMS

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: out/*.tar.gz

      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: gh release upload "$TAG" out/*.tar.gz out/SHA256SUMS --repo "$GITHUB_REPOSITORY" --clobber
