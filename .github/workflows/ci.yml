name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Git hooks are a local convenience; CI runs the same checks explicitly.
  LEFTHOOK: "0"

jobs:
  quality:
    name: Quality gate (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          cache: true

      - name: Install
        run: bun install --frozen-lockfile

      - name: Format
        run: bun run format:check

      - name: Lint
        run: bun run lint

      - name: Lint workflows
        run: bun run lint:workflows

      - name: Typecheck
        run: bun run typecheck

      - name: Dead code and unused dependencies
        run: bun run deadcode

      - name: Architecture boundaries
        run: bun run test:arch

      - name: Unit and integration tests (coverage gate)
        run: bun run test:coverage

      - name: Report coverage to Coveralls
        # Fork and Dependabot pull requests do not receive repository secrets.
        if: >-
          matrix.os == 'ubuntu-24.04' &&
          github.actor != 'dependabot[bot]' &&
          (github.event_name == 'push' ||
           github.event.pull_request.head.repo.full_name == github.repository)
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2.3.8
        with:
          github-token: ${{ secrets.COVERALLS_REPO_TOKEN }}
          file: coverage/lcov.info
          format: lcov
          # The coverage threshold above is the gate; a Coveralls outage must not block merges.
          fail-on-error: false

      - name: Contract tests
        run: bun run test:contract

      - name: End-to-end tests
        run: bun run test:e2e

      - name: Build and smoke-test binary
        env:
          XUEFU_CONFIG_DIR: ${{ runner.temp }}/xuefu-config
          XUEFU_DATA_DIR: ${{ runner.temp }}/xuefu-data
        run: |
          bun run build
          ./dist/xuefu --version
          ./dist/xuefu diagnostics --json

  commits:
    name: Conventional commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          cache: true

      - name: Install
        run: bun install --frozen-lockfile

      - name: Lint commit messages
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bunx commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose

      - name: Lint pull request title
        env:
          # Passed via env, never interpolated into the script, to avoid injection.
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | bunx commitlint --verbose
