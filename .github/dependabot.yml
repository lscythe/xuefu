version: 2
# Bun dependencies are not listed: Dependabot rejects bun.lock lockfileVersion 2
# (written by Bun 1.4) and fails every run. Re-add the bun ecosystem once it is
# supported; until then update with `bun update` and review the lockfile diff.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]
    labels: [dependencies]
